<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='images/Gold Coin with Letter _T_.png')}}">
    <title>{% block title %}TECACoin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='TECACoin_landing_page.css')}}">
</head>
<body>

<header>
 <div class="container">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="#">
        <img src="{{ url_for('static', filename='images/TECACOIN Logo Design.png')}}" width="90" alt="TECACoin Logo">
      </a>

      <!-- Hamburger Menu -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar Links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="nav-links navbar-nav me-auto mb-2 mb-lg-0">
          <li><a href="{{ url_for('home') }}">Home</a></li>
          <li><a href="{{ url_for('about') }}">About</a></li>
          <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>

        <div class="d-flex flex-wrap gap-2">
          {% if current_user.is_authenticated %}
            <a href="{{ url_for('dashboard')}}" class="btnn btn-sm">Dashboard</a>
            {% if not current_user.is_a_miner %}
              <form action="{{ url_for('become_a_miner')}}" method="post" class="d-inline">
                <button class="btnn" type="submit" style="background-color: rgba(13, 17, 33, 0.8);">Become a Miner</button>
              </form>
            {% endif %}
            <a href="{{ url_for('logout')}}" class="btnn btn-sm">Logout</a>
          {% else %}
            <a href="{{ url_for('get_started')}}" class="btnn btn-sm">Get Started</a>
            <a href="{{ url_for('login')}}" class="btnn btn-sm">Login</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
 </div>
</header>

    <div>
        {% block content %}{% endblock %}
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" 
        crossorigin="anonymous"></script>


{% block scripts %}{% endblock %}
</body>
</html>
